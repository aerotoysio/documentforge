# Commit this to aerotoysio/documentforge as `.github/workflows/release.yml`.
#
# What it does:
#  - On every push to master (or manual run), build BOTH images in parallel:
#      - dfdb engine          (root Dockerfile)               -> ghcr.io/aerotoysio/documentforge:latest
#      - admin UI (Next.js)   (admin-ui/Dockerfile)            -> ghcr.io/aerotoysio/documentforge-admin:latest
#  - Each gets `latest` + `master-<sha>` tags so you can pin/rollback.
#  - Buildx caching via GitHub Actions cache makes incremental builds quick.
#  - Watchtower on the host picks up either image's new digest and recreates
#    just that container (volumes preserved).
#
# Permissions: uses the auto-provisioned GITHUB_TOKEN. No PAT needed.
#
# After the first successful run, set both packages to "Public" in:
#   https://github.com/orgs/aerotoysio/packages/container/documentforge/settings
#   https://github.com/orgs/aerotoysio/packages/container/documentforge-admin/settings
# (or give Watchtower a docker-login if you want them private.)

name: Build & publish dfdb images

on:
  push:
    branches: [master]
    # Versioned releases — push a v1.2.3 tag and the workflow tags the
    # images with 1.2.3, 1.2, and 1 alongside the master `latest`.
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dfdb engine
            image: ghcr.io/${{ github.repository_owner }}/documentforge
            context: .
            dockerfile: Dockerfile
            build_args: ""
          - name: admin UI
            image: ghcr.io/${{ github.repository_owner }}/documentforge-admin
            context: ./admin-ui
            dockerfile: admin-ui/Dockerfile
            # NEXT_PUBLIC_* values are baked into the JS bundle at build time.
            # Today we ship a single image targeting same-host browsers (localhost:5000).
            # If you ever want a public-tunnel build, override this in a second matrix entry.
            build_args: |
              NEXT_PUBLIC_DFDB_URL=http://localhost:5000

    name: Build ${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=master-,format=short
            # Push-on-tag (e.g. v1.1.0) → 1.1.0 + 1.1 + 1.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  trigger-deploy:
    # Fires once after BOTH matrix entries succeed, not once per entry.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Watchtower deploy
        # Push-trigger so the host pulls + recreates within seconds rather
        # than waiting for the 5-min poll fallback.
        run: |
          # Watchtower processes one scan at a time and returns 429 to
          # concurrent triggers. A 429 just means "try again shortly".
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/wt.body -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
              https://watchtower.vollandes.com/v1/update)
            echo "attempt $attempt: HTTP $code"
            cat /tmp/wt.body 2>/dev/null || true; echo
            case "$code" in
              200) exit 0 ;;
              429) sleep $((attempt * 10)) ;;
              *)   exit 1 ;;
            esac
          done
          echo "Watchtower trigger: max retries exhausted"
          exit 1
